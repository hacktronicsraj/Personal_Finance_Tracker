name = "pft"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Digest crons. IST is a fixed +5:30 (no DST).
#  - Weekly:  Sun 14:30 UTC = 20:00 IST.  (Cloudflare rejects day-of-week 0 — use SUN.)
#  - Monthly: last day of month 18:30 UTC = 00:00 IST on the 1st → covers the
#    month that just ended (the scheduled handler matches on the ' L ' cron).
[triggers]
crons = ["30 14 * * SUN", "30 18 L * *"]

# LLM config (non-secret). Set LLM_API_KEY via: wrangler secret put LLM_API_KEY
# Provider: Google Gemini via its OpenAI-compatible endpoint.
# If LLM_API_KEY is missing, classification falls back to the built-in rules,
# so a fresh deploy still works before the secret is set.
# (Local dev: .dev.vars overrides these — see .dev.vars.example.)
[vars]
LLM_MODE = "live"
LLM_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
LLM_MODEL = "gemini-flash-latest"
# Weekly digest (M7) uses a stronger model for the one call/week; free-tier
# limits are irrelevant at that volume. Falls back to LLM_MODEL if the call fails.
LLM_REPORT_MODEL = "gemini-2.5-pro"
# API_TOKEN is optional locally; set as a secret in production:
#   wrangler secret put API_TOKEN

[[d1_databases]]
binding = "DB"
database_name = "pft"
database_id = "93388329-7902-437f-97bc-135ecf8a2cda"

# Receipt/attachment storage (M6). Private bucket — all access proxied through
# the authed Worker.
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "pft-attachments"
